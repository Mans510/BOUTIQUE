<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6E7B0" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#F2D179" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF2A3" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, -10)">
    <!-- Arch / Halo Ring -->
    <path d="M 120 255 A 140 140 0 1 1 380 255" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" opacity="0.9" />

    <!-- Dressmaker Mannequin Finial / Top Knob -->
    <circle cx="250" cy="90" r="7.5" fill="url(#goldGrad)" />
    <rect x="247.5" y="97.5" width="5" height="8" rx="2" fill="url(#goldGrad)" />

    <!-- Mannequin Torso Outline -->
    <path d="M 235 106 
             C 240 114, 260 114, 265 106 
             L 282 124 
             C 272 145, 274 158, 265 174 
             L 235 174 
             C 226 158, 228 145, 218 124 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Mannequin Base Bar -->
    <line x1="232" y1="174" x2="268" y2="174" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Flowing Gown Skirt Pleats / Drapes radiating down -->
    <!-- Center Drapes -->
    <path d="M 245 180 Q 242 225 240 262" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <path d="M 255 180 Q 258 225 260 262" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
    <!-- Mid Drapes -->
    <path d="M 238 180 Q 220 220 198 258" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 262 180 Q 280 220 302 258" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
    <!-- Outer Swoop Drapes -->
    <path d="M 234 180 C 205 210, 160 240, 140 262" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 266 180 C 295 210, 340 240, 360 262" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Brand Typography: MANS -->
    <text x="250" y="335" 
          font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" 
          font-size="76" 
          font-weight="700" 
          letter-spacing="9" 
          fill="url(#goldGrad)" 
          text-anchor="middle">MANS</text>

    <!-- Subtitle: BOUTIQUE -->
    <text x="250" y="375" 
          font-family="'Montserrat', 'Plus Jakarta Sans', sans-serif" 
          font-size="22" 
          font-weight="500" 
          letter-spacing="18" 
          fill="url(#goldGrad)" 
          text-anchor="middle">BOUTIQUE</text>

    <!-- Decorative Gold Divider with Center 4-point Star -->
    <g transform="translate(0, 10)">
      <!-- Left Line -->
      <line x1="125" y1="395" x2="235" y2="395" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="125" cy="395" r="2.5" fill="url(#goldGrad)" />

      <!-- Center 4-Point Star Diamond -->
      <path d="M 250 385 
               Q 250 395 260 395 
               Q 250 395 250 405 
               Q 250 395 240 395 
               Q 250 395 250 385 Z" 
            fill="url(#goldShine)" />

      <!-- Right Line -->
      <line x1="265" y1="395" x2="375" y2="395" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
      <circle cx="375" cy="395" r="2.5" fill="url(#goldGrad)" />
    </g>
  </g>
</svg>

